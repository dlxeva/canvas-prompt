<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活动报名原型</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #17233a; background: #f4f7fb; font-family: system-ui, sans-serif; }
    main { width: min(720px, calc(100% - 32px)); margin: 48px auto; padding: 32px; border-radius: 20px; background: white; box-shadow: 0 18px 54px rgba(34,51,84,.12); }
    p { color: #62708a; line-height: 1.6; }
    label { display: grid; gap: 8px; margin: 24px 0; font-weight: 700; }
    input { min-height: 44px; border: 1px solid #cdd5e3; border-radius: 10px; padding: 0 12px; font: inherit; }
    button { min-height: 44px; border: 0; border-radius: 10px; padding: 0 18px; color: white; background: #2557e0; font: inherit; font-weight: 750; cursor: pointer; }
    #result { margin-top: 18px; padding: 16px; border-radius: 12px; background: #edf8f1; color: #17643a; }
  </style>
</head>
<body>
  <main>
    <p>体验任务</p>
    <h1>报名参加产品共创会</h1>
    <p>填写一个称呼，然后查看下一步。这里不会发送任何真实信息。</p>
    <label>怎么称呼你？<input data-element-id="participant-name" placeholder="例如：小林"></label>
    <button data-element-id="continue-button" type="button">继续</button>
    <div id="result" hidden>下一步：选择希望讨论的产品方向。</div>
  </main>
  <script>
    document.querySelector('[data-element-id="continue-button"]').addEventListener('click', () => {
      document.querySelector('#result').hidden = false
      location.hash = 'choose-topic'
    })
  </script>
</body>
</html>
